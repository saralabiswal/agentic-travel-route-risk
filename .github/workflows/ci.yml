name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@v3
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
      - run: uv sync --all-groups --frozen
      - name: Audit locked Python dependencies
        run: uv run pip-audit --local

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
      - run: uv sync --all-groups --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Verify container build
        run: docker build --file infra/docker/Dockerfile --tag routeshield:${{ github.sha }} .
      - name: Validate Terraform formatting
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
