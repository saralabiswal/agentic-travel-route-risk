<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RouteShield physical deployment architecture</title>
  <desc id="desc">Browser users reach the web console and API through HTTPS. The API runs on Cloud Run, accesses private Cloud SQL and Redis through a VPC connector, and uses Google Cloud services for secrets, evidence, events, scheduling, and monitoring.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf3fb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1d3557" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#46637f"/>
    </marker>
    <style>
      .heading { font: 700 28px Arial, sans-serif; fill: #16324f; }
      .sub { font: 400 15px Arial, sans-serif; fill: #48627b; }
      .lane { font: 700 15px Arial, sans-serif; fill: #36546f; letter-spacing: 1.2px; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #16324f; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #36546f; }
      .small { font: 400 12px Arial, sans-serif; fill: #48627b; }
      .line { stroke: #46637f; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#surface)"/>
  <text x="64" y="59" class="heading">RouteShield physical deployment architecture</text>
  <text x="64" y="87" class="sub">A human-controlled decisioning service: evidence and policy stay server-side; authority to act stays with people.</text>

  <rect x="46" y="120" width="1348" height="144" rx="18" fill="#ffffff" stroke="#c8d8e8"/>
  <text x="70" y="149" class="lane">USERS AND HTTPS EDGE</text>
  <rect x="100" y="174" width="190" height="60" rx="10" fill="#e9f3ff" stroke="#7ba8d4" filter="url(#shadow)"/>
  <text x="195" y="200" text-anchor="middle" class="box-title">Browser</text>
  <text x="195" y="219" text-anchor="middle" class="box-text">Traveler · Manager · Admin</text>
  <rect x="434" y="174" width="244" height="60" rx="10" fill="#e9f3ff" stroke="#7ba8d4" filter="url(#shadow)"/>
  <text x="556" y="200" text-anchor="middle" class="box-title">HTTPS load balancer</text>
  <text x="556" y="219" text-anchor="middle" class="box-text">Optional custom domain and TLS</text>
  <rect x="828" y="174" width="260" height="60" rx="10" fill="#e9f3ff" stroke="#7ba8d4" filter="url(#shadow)"/>
  <text x="958" y="200" text-anchor="middle" class="box-title">Cloud Run web console</text>
  <text x="958" y="219" text-anchor="middle" class="box-text">Static UI · no secrets</text>
  <path d="M290 204 H434" class="line"/>
  <path d="M678 204 H828" class="line"/>

  <rect x="46" y="290" width="1348" height="280" rx="18" fill="#f7fbff" stroke="#b8cae0"/>
  <text x="70" y="320" class="lane">APPLICATION RUNTIME · CLOUD RUN</text>
  <rect x="100" y="350" width="330" height="166" rx="12" fill="#ffffff" stroke="#7397bb" filter="url(#shadow)"/>
  <text x="265" y="380" text-anchor="middle" class="box-title">RouteShield API</text>
  <text x="265" y="406" text-anchor="middle" class="box-text">OIDC · tenant/role authorization</text>
  <text x="265" y="428" text-anchor="middle" class="box-text">Ingestion · evidence · deterministic risk</text>
  <text x="265" y="450" text-anchor="middle" class="box-text">Bounded LangGraph · human approval</text>
  <text x="265" y="480" text-anchor="middle" class="small">Server-side provider and model boundary</text>
  <rect x="548" y="350" width="286" height="166" rx="12" fill="#ffffff" stroke="#7397bb" filter="url(#shadow)"/>
  <text x="691" y="380" text-anchor="middle" class="box-title">Cloud Run jobs</text>
  <text x="691" y="406" text-anchor="middle" class="box-text">Migrations · due-trip monitor</text>
  <text x="691" y="428" text-anchor="middle" class="box-text">Notification, retention, deletion</text>
  <text x="691" y="480" text-anchor="middle" class="small">Idempotent workers and outbox leases</text>
  <rect x="953" y="350" width="336" height="166" rx="12" fill="#ffffff" stroke="#7397bb" filter="url(#shadow)"/>
  <text x="1121" y="380" text-anchor="middle" class="box-title">Runtime controls</text>
  <text x="1121" y="406" text-anchor="middle" class="box-text">LLM · ReAct · providers · notifications</text>
  <text x="1121" y="428" text-anchor="middle" class="box-text">Per-tenant overrides with audit history</text>
  <text x="1121" y="480" text-anchor="middle" class="small">Fail closed when disabled or unavailable</text>
  <path d="M958 234 V350" class="line"/>
  <path d="M430 433 H548" class="line"/>
  <path d="M834 433 H953" class="line"/>

  <rect x="46" y="596" width="846" height="238" rx="18" fill="#f5f9f5" stroke="#afcbb6"/>
  <text x="70" y="626" class="lane">PRIVATE DATA PLANE · VPC CONNECTOR</text>
  <rect x="92" y="662" width="205" height="122" rx="12" fill="#ffffff" stroke="#75a97f" filter="url(#shadow)"/>
  <text x="194" y="694" text-anchor="middle" class="box-title">Cloud SQL</text>
  <text x="194" y="719" text-anchor="middle" class="box-text">Tenant records · audit</text>
  <text x="194" y="740" text-anchor="middle" class="box-text">LangGraph checkpoints</text>
  <rect x="363" y="662" width="205" height="122" rx="12" fill="#ffffff" stroke="#75a97f" filter="url(#shadow)"/>
  <text x="465" y="694" text-anchor="middle" class="box-title">Memorystore Redis</text>
  <text x="465" y="719" text-anchor="middle" class="box-text">Rate limit · cache</text>
  <text x="465" y="740" text-anchor="middle" class="box-text">Short-lived idempotency</text>
  <rect x="634" y="662" width="205" height="122" rx="12" fill="#ffffff" stroke="#75a97f" filter="url(#shadow)"/>
  <text x="736" y="694" text-anchor="middle" class="box-title">Secret Manager</text>
  <text x="736" y="719" text-anchor="middle" class="box-text">Runtime credentials only</text>
  <text x="736" y="740" text-anchor="middle" class="box-text">Least-privilege identities</text>
  <path d="M265 516 V662" class="line"/>
  <path d="M335 516 V603 H465 V662" class="line"/>
  <path d="M395 516 V603 H736 V662" class="line"/>

  <rect x="918" y="596" width="476" height="238" rx="18" fill="#fffaf2" stroke="#dfc38e"/>
  <text x="942" y="626" class="lane">EVENTS, EVIDENCE, AND OPERATIONS</text>
  <rect x="944" y="662" width="188" height="122" rx="12" fill="#ffffff" stroke="#d5ad62" filter="url(#shadow)"/>
  <text x="1038" y="694" text-anchor="middle" class="box-title">Storage</text>
  <text x="1038" y="719" text-anchor="middle" class="box-text">Quarantined uploads</text>
  <text x="1038" y="740" text-anchor="middle" class="box-text">Redacted evidence artifacts</text>
  <rect x="1176" y="662" width="188" height="122" rx="12" fill="#ffffff" stroke="#d5ad62" filter="url(#shadow)"/>
  <text x="1270" y="694" text-anchor="middle" class="box-title">Pub/Sub + Scheduler</text>
  <text x="1270" y="719" text-anchor="middle" class="box-text">Due checks · queues</text>
  <text x="1270" y="740" text-anchor="middle" class="box-text">Dead-letter observability</text>
  <path d="M430 470 H944 V662" class="line dash"/>
  <path d="M834 470 H1270 V662" class="line dash"/>
  <text x="100" y="870" class="small">Solid lines: request and private data paths. Dashed lines: asynchronous evidence, event, and job paths. External providers are reached only through server-side adapters.</text>
</svg>
