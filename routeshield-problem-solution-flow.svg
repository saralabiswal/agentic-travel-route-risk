<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">How RouteShield turns operational signals into a controlled intervention</title>
  <desc id="desc">A reusable five-stage operating pattern, illustrated with flight disruption: fragmented signals are validated and normalized, assessed by deterministic rules, investigated by a bounded agent for elevated risk, and presented to an authorized owner for approval before durable notifications or actions are queued.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#3177ab"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#25805f"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .eyebrow { font-size: 14px; font-weight: 800; letter-spacing: 1.7px; fill: #2367a6; }
      .heading { font-size: 31px; font-weight: 800; }
      .subheading { font-size: 16px; fill: #526d82; }
      .step { font-size: 12px; font-weight: 800; letter-spacing: 1px; fill: #54718a; }
      .card-title { font-size: 18px; font-weight: 800; }
      .card-copy { font-size: 13px; fill: #3f5b70; }
      .small { font-size: 12px; font-weight: 700; fill: #54718a; }
      .callout { font-size: 10.5px; font-weight: 800; fill: #54718a; }
      .bar-title { font-size: 14px; font-weight: 800; fill: #174b78; }
      .bar-copy { font-size: 13px; fill: #3f5b70; }
    </style>
  </defs>

  <rect width="1440" height="660" fill="#f7fafc"/>
  <rect x="0" y="0" width="1440" height="130" fill="#ffffff"/>
  <rect x="0" y="128" width="1440" height="2" fill="#d8e7f0"/>
  <text x="60" y="50" class="eyebrow">A REUSABLE HUMAN-CONTROLLED DECISIONING PATTERN</text>
  <text x="60" y="88" class="heading">From fragmented operational signals to a controlled intervention</text>
  <text x="60" y="114" class="subheading">Illustrated with flight disruption: deterministic controls assess risk, the bounded agent explains it, and people retain decision authority.</text>

  <!-- Connecting flow lines -->
  <path d="M284 304 H316" fill="none" stroke="#3177ab" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M548 304 H580" fill="none" stroke="#3177ab" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M812 304 H844" fill="none" stroke="#3177ab" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1076 304 H1108" fill="none" stroke="#25805f" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Stage 1 -->
  <rect x="60" y="190" width="224" height="248" rx="16" fill="#ffffff" stroke="#9bb9cd" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="91" cy="224" r="16" fill="#dbeefa"/>
  <path d="M84 224h14M91 217v14" stroke="#2367a6" stroke-width="2" stroke-linecap="round"/>
  <text x="119" y="218" class="step">01 · COLLECT</text>
  <text x="84" y="266" class="card-title">Operational signals</text>
  <text x="84" y="299" class="card-copy">Example: itinerary change</text>
  <text x="84" y="323" class="card-copy">Flight · weather · traffic · advisory</text>
  <text x="84" y="347" class="card-copy">Owner refreshes and questions</text>
  <rect x="84" y="376" width="176" height="34" rx="8" fill="#eef6ff"/>
  <text x="105" y="398" class="callout">Source freshness varies</text>

  <!-- Stage 2 -->
  <rect x="324" y="190" width="224" height="248" rx="16" fill="#ffffff" stroke="#7db4d6" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="355" cy="224" r="16" fill="#dbeefa"/>
  <path d="M348 224l5 5 10-11" stroke="#2367a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="383" y="218" class="step">02 · PROTECT</text>
  <text x="348" y="266" class="card-title">Validate and normalize</text>
  <text x="348" y="299" class="card-copy">Tenant-scoped records</text>
  <text x="348" y="323" class="card-copy">Schema and replay checks</text>
  <text x="348" y="347" class="card-copy">Evidence source and expiry</text>
  <rect x="348" y="376" width="176" height="34" rx="8" fill="#eef6ff"/>
  <text x="367" y="398" class="callout">Unknown evidence stays visible</text>

  <!-- Stage 3 -->
  <rect x="588" y="190" width="224" height="248" rx="16" fill="#edf8f2" stroke="#58a883" stroke-width="1.7" filter="url(#shadow)"/>
  <circle cx="619" cy="224" r="16" fill="#dff3e9"/>
  <path d="M612 230v-8M620 230v-15M628 230v-11" stroke="#25805f" stroke-width="2.2" stroke-linecap="round"/>
  <text x="647" y="218" class="step">03 · ASSESS</text>
  <text x="612" y="266" class="card-title">Deterministic assessment</text>
  <text x="612" y="299" class="card-copy">Weighted, reproducible score</text>
  <text x="612" y="323" class="card-copy">Severity and source health</text>
  <text x="612" y="347" class="card-copy">Policy version is recorded</text>
  <rect x="612" y="366" width="176" height="44" rx="8" fill="#dff3e9"/>
  <text x="627" y="385" class="callout">Low / Watch → monitor safely</text>
  <text x="627" y="402" class="callout">High / Critical → investigate</text>

  <!-- Stage 4 -->
  <rect x="852" y="190" width="224" height="248" rx="16" fill="#eef6ff" stroke="#5394c8" stroke-width="1.7" filter="url(#shadow)"/>
  <circle cx="883" cy="224" r="16" fill="#dbeefa"/>
  <path d="M876 218h14v12h-14zM879 224h8M883 221v6" stroke="#2367a6" stroke-width="1.8" stroke-linejoin="round" fill="none"/>
  <text x="911" y="218" class="step">04 · INVESTIGATE</text>
  <text x="876" y="266" class="card-title">Bounded agent workflow</text>
  <text x="876" y="299" class="card-copy">Read-only, scoped tools</text>
  <text x="876" y="323" class="card-copy">Evidence-linked explanation</text>
  <text x="876" y="347" class="card-copy">Policy-eligible alternatives</text>
  <rect x="876" y="366" width="176" height="44" rx="8" fill="#dbeefa"/>
  <text x="892" y="385" class="callout">No booking, payment, or</text>
  <text x="892" y="402" class="callout">policy override</text>

  <!-- Stage 5 -->
  <rect x="1116" y="190" width="264" height="248" rx="16" fill="#edf8f2" stroke="#58a883" stroke-width="1.7" filter="url(#shadow)"/>
  <circle cx="1147" cy="224" r="16" fill="#dff3e9"/>
  <path d="M1141 226c3-8 9-8 12 0M1143 219a4 4 0 1 1 8 0" stroke="#25805f" stroke-width="2" stroke-linecap="round" fill="none"/>
  <text x="1175" y="218" class="step">05 · CONTROL ACTION</text>
  <text x="1140" y="263" class="card-title">Authorized review</text>
  <text x="1140" y="286" class="card-title">and approval</text>
  <text x="1140" y="315" class="card-copy">Review evidence and guidance</text>
  <text x="1140" y="338" class="card-copy">Record approval and audit trail</text>
  <text x="1140" y="361" class="card-copy">Queue notification or safe action</text>
  <rect x="1140" y="380" width="216" height="32" rx="8" fill="#dff3e9"/>
  <text x="1156" y="401" class="callout">External delivery requires opt-in</text>

  <!-- Safeguard bar -->
  <rect x="60" y="492" width="1320" height="104" rx="16" fill="#ffffff" stroke="#d8e7f0" stroke-width="1.5"/>
  <rect x="60" y="492" width="10" height="104" rx="5" fill="#2367a6"/>
  <text x="96" y="529" class="bar-title">Controls that apply across the full flow</text>
  <text x="96" y="557" class="bar-copy">OIDC and tenant isolation · idempotency and replay protection · audit-log redaction · retention, DSAR, and legal holds</text>
  <text x="96" y="579" class="bar-copy">Runtime kill switches · source freshness and degraded-mode routing · durable checkpoints, outbox claims, monitoring, and runbooks</text>

  <text x="60" y="630" class="small">The pattern shortens the path to an informed decision without automating authority to spend, book, override policy, or take another consequential action.</text>
</svg>
